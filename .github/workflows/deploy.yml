name: Deploy Web App to GitHub Pages

# متى يتم تشغيل هذا السكربت؟ (عند رفع أي تعديل على فرع main)
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# إعطاء الصلاحيات لـ GitHub Actions لتعديل صفحة الويب
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # المسار الذي يحتوي على ملفات التطبيق (نقطة تعني المجلد الرئيسي)
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
