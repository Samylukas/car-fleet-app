<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Samy Fleet Pro 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f6; color: #333; overflow-x: hidden; scroll-behavior: smooth; }

        #splashScreen { position: fixed; inset: 0; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999999; color: #1e3c72; transition: opacity 0.6s ease, visibility 0.6s ease; }
        .splash-logo { font-size: 4rem; margin-bottom: 10px; }
        .splash-title { font-size: 2.2rem; font-weight: bold; margin-bottom: 5px; }
        .spinner { width: 45px; height: 45px; border: 4px solid rgba(30, 60, 114, 0.1); border-top-color: #f39c12; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #loginOverlay { position: fixed; inset: 0; background: linear-gradient(135deg, rgba(30,60,114,0.95), rgba(42,82,152,0.95)); display: flex; justify-content: center; align-items: center; z-index: 99999; }
        .login-card { background: #ffffff; padding: 35px 25px; border-radius: 16px; text-align: center; width: 90%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .login-card h2 { color: #1e3c72; margin-bottom: 8px; font-size: 1.6rem; }
        
        .app-container { max-width: 900px; margin: 20px auto; background: transparent; padding: 0 10px; min-height: 90vh; padding-bottom: 60px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header-bar span { font-weight: bold; color: #1e3c72; font-size: 1.1rem; }
        
        .network-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-top: 5px; }
        .network-online { background: #eafaf1; color: #27ae60; border: 1px solid #27ae60; }
        .network-offline { background: #fdedec; color: #c0392b; border: 1px solid #c0392b; }

        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .nav-tabs::-webkit-scrollbar { display: none; }
        .tab-btn { background: #fff; color: #7f8c8d; border: 1px solid #e0e0e0; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.95rem; flex-shrink: 0; }
        .tab-btn.active { background: #1e3c72; color: #fff; border-color: #1e3c72; box-shadow: 0 4px 10px rgba(30,60,114,0.3); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .section-title { font-weight: bold; color: #1e3c72; border-bottom: 2px solid #f39c12; padding-bottom: 8px; margin-bottom: 20px; font-size: 1.2rem; display: inline-block; }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; text-align: left; position: relative; }
        .form-group label { font-size: 0.85rem; font-weight: bold; margin-bottom: 6px; color: #2c3e50; }
        .form-group input, .form-group select { padding: 12px; border: 1px solid #dcdde1; border-radius: 8px; font-size: 0.95rem; outline: none; background: #f8f9fa; }
        
        .pass-wrapper { position: relative; width: 100%; }
        .pass-wrapper input { width: 100%; padding-right: 40px; }
        .pass-toggle-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; }

        .currency-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; background: #f1f8ff; padding: 15px; border-radius: 10px; margin-top: 10px; border: 1px solid #cce5ff;}
        .tips-grid { background: #fffaf0; border: 1px solid #fdebd0; }
        .currency-box { text-align: center; }
        .currency-box label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #1e3c72; }
        .currency-box input { width: 100%; padding: 10px; border: 1px solid #a4b0be; border-radius: 6px; text-align: center; font-weight: bold; }

        .summary-box { margin-top:10px; padding:10px; border-radius:8px; display:inline-block; border: 1px solid; }
        .summary-rev { background:#eafaf1; border-color:#27ae60; color:#27ae60; }
        .summary-tip { background:#fef5e7; border-color:#e67e22; color:#e67e22; }

        .btn { border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; font-size: 1rem; color: white; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:disabled { background: #95a5a6; cursor: not-allowed; }
        .btn-green { background: #27ae60; } .btn-blue { background: #1e3c72; } .btn-red { background: #e74c3c; }
        
        #toastStack { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 999999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; }
        .toast { color: white; padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        
        table { width: 100%; border-collapse: collapse; min-width: 600px; background: #fff; margin-top: 15px;}
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; font-size: 0.9rem; }
        th { background: #1e3c72; color: white; }
        .total-row { background: #eafaf1; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>
<div id="toastStack"></div>

<div id="splashScreen">
    <div class="splash-logo">🚘</div>
    <div class="splash-title">Samy Fleet Pro</div>
    <div class="spinner"></div>
</div>

<div id="loginOverlay" style="visibility: hidden; opacity: 0;">
    <div class="login-card">
        <h2>Login</h2>
        <p>Secured Fleet Management</p>
        <div class="form-group">
            <label>Username:</label>
            <select id="loginUser" style="text-align:center; font-weight: bold;"><option value="">-- Select User --</option></select>
        </div>
        <div class="form-group" style="margin-top:15px; margin-bottom: 25px;">
            <label>Password:</label>
            <div class="pass-wrapper">
                <input type="password" id="loginPass" placeholder="Enter password..." style="text-align:center; letter-spacing: 2px;" onkeypress="if(event.key === 'Enter') login()">
                <button type="button" class="pass-toggle-btn" onclick="togglePasswordVisibility()">👁️</button>
            </div>
        </div>
        <button id="loginBtn" class="btn btn-blue" style="width:100%;" onclick="login()" disabled>⏳ Connecting...</button>
    </div>
</div>

<div class="app-container" id="mainApp" style="display:none;">
    <div class="header-bar">
        <div>
            <span id="userInfo">👤 Welcome</span>
            <div id="networkStatus" class="network-badge network-online">🟢 Online</div>
        </div>
        <button class="btn btn-red" onclick="logout()">Logout 🚪</button>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="showTab('addTripTab', this)">📝 Add Trip</button>
        <button class="tab-btn admin-only" onclick="showTab('financeTab', this)">💵 Finance</button>
        <button class="tab-btn admin-only" onclick="showTab('reportsTab', this)">📊 Reports</button>
        <button class="tab-btn admin-only" onclick="showTab('settingsTab', this)">🛠️ Exchange Rates</button>
    </div>

    <!-- Tab 1: Add Trip -->
    <div id="addTripTab" class="tab-content active">
        <div class="card">
            <h2 class="section-title">Add New Trip</h2>
            <div class="grid-form">
                <!-- تم تحويل القوائم إلى حقول نصية ذكية (Datalist) -->
                <div class="form-group">
                    <label>Client:</label>
                    <input type="text" id="tripClient" list="clientList" placeholder="Type or select client...">
                    <datalist id="clientList"></datalist>
                </div>
                <div class="form-group">
                    <label>Driver:</label>
                    <input type="text" id="tripDriver" list="driverList" placeholder="Type or select driver...">
                    <datalist id="driverList"></datalist>
                </div>
                <div class="form-group">
                    <label>Trip Name:</label>
                    <input type="text" id="tripName" list="tripList" placeholder="e.g. Airport Transfer...">
                    <datalist id="tripList"></datalist>
                </div>
                <div class="form-group"><label>Date:</label><input type="date" id="tripDate"></div>
            </div>

            <div style="margin-top: 25px;">
                <label style="font-weight:bold; color:#1e3c72;">💰 Revenue Collected from Client:</label>
                <div class="currency-grid">
                    <div class="currency-box"><label>EGP</label><input type="number" id="revEGP" value="0" oninput="calcTotals()" onfocus="if(this.value=='0')this.value=''"></div>
                    <div class="currency-box"><label>USD ($)</label><input type="number" id="revUSD" value="0" oninput="calcTotals()" onfocus="if(this.value=='0')this.value=''"></div>
                    <div class="currency-box"><label>EUR (€)</label><input type="number" id="revEUR" value="0" oninput="calcTotals()" onfocus="if(this.value=='0')this.value=''"></div>
                    <div class="currency-box"><label>GBP (£)</label><input type="number" id="revGBP" value="0" oninput="calcTotals()" onfocus="if(this.value=='0')this.value=''"></div>
                </div>
                <div class="summary-box summary-rev"><span style="font-weight:bold;">Equivalent Revenue (EGP): </span><span id="totalRevEGP" style="font-weight:bold; font-size:1.2rem;">0.00</span></div>
            </div>

            <div style="margin-top: 25px;">
                <label style="font-weight:bold; color:#d35400;">🎁 Tips / Gratuity:</label>
                <div class="currency-grid tips-grid">
                    <div class="currency-box"><label>EGP</label><input type="number" id="tipEGP" value="0" oninput="calcTotals()" onfocus="if(this.value=='0')this.value=''"></div>
                    <div class="currency-box"><label>USD ($)</label><input type="number" id="tipUSD" value="0" oninput="calcTotals()" onfocus="if(this.value=='0')this.value=''"></div>
                    <div class="currency-box"><label>EUR (€)</label><input type="number" id="tipEUR" value="0" oninput="calcTotals()" onfocus="if(this.value=='0')this.value=''"></div>
                    <div class="currency-box"><label>GBP (£)</label><input type="number" id="tipGBP" value="0" oninput="calcTotals()" onfocus="if(this.value=='0')this.value=''"></div>
                </div>
            </div>

            <div class="grid-form" style="margin-top:25px; padding-top: 20px; border-top: 1px dashed #dcdde1;">
                <div class="form-group"><label style="color:#e74c3c;">💵 Driver Fee / Expenses (EGP):</label><input type="number" id="tripDriverFee" placeholder="Driver salary, fuel..." oninput="calcTotals()"></div>
                <div class="form-group"><label>Notes (Optional):</label><input type="text" id="tripNotes" placeholder="Any details..."></div>
            </div>

            <div style="margin-top:20px; padding:15px; background:#1e3c72; color:white; border-radius:10px; text-align:center;">
                <span style="font-size:1.1rem;">Net Commission:</span><br><span id="netCommission" style="color:#f1c40f; font-size:2rem; font-weight:bold;">0.00</span> EGP
            </div>

            <button class="btn btn-green" style="width:100%; margin-top:20px;" onclick="saveTrip()">Save & Submit Trip 💾</button>
        </div>
    </div>

    <!-- Tab 2: Finance -->
    <div id="financeTab" class="tab-content admin-only">
        <div class="card">
            <h2 class="section-title">💵 General Finance & Expenses</h2>
            <div class="grid-form">
                <div class="form-group"><label>Type:</label><select id="finType"><option value="Expense" style="color:red;">Expense</option><option value="Revenue" style="color:green;">Revenue</option></select></div>
                <div class="form-group"><label>Category:</label><input type="text" id="finCategory" list="catList"><datalist id="catList"><option value="Car Maintenance"><option value="Fuel / Gas"><option value="Admin Expenses"></datalist></div>
                <div class="form-group"><label>Amount (EGP):</label><input type="number" id="finAmount"></div>
                <div class="form-group"><label>Date:</label><input type="date" id="finDate"></div>
                <div class="form-group" style="grid-column: span 2;"><label>Notes:</label><input type="text" id="finNotes"></div>
            </div>
            <button class="btn btn-blue" style="width:100%; margin-top:20px;" onclick="saveFinance()">Submit Transaction 💾</button>
        </div>
    </div>

    <!-- Tab 3: Reports -->
    <div id="reportsTab" class="tab-content admin-only">
        <div class="card">
            <h2 class="section-title">📊 Reports Dashboard</h2>
            <div class="grid-form">
                <div class="form-group">
                    <label>Report Type:</label>
                    <select id="reportType" onchange="toggleReportTarget()">
                        <option value="client">Client Statement (Revenue)</option>
                        <option value="driver">Driver Statement (Expenses)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Target Name:</label>
                    <select id="reportTarget">
                        <!-- Options generated dynamically -->
                    </select>
                </div>
                <div class="form-group"><label>From Date:</label><input type="date" id="repFrom"></div>
                <div class="form-group"><label>To Date:</label><input type="date" id="repTo"></div>
            </div>
            
            <div style="display:flex; gap:10px; margin-top:15px; flex-wrap: wrap;">
                <button id="searchBtn" class="btn btn-blue" style="flex:1;" onclick="fetchReports()">Search 🔍</button>
                <button class="btn btn-green" style="flex:1;" onclick="exportToExcel()">Export Excel 📊</button>
            </div>
            
            <div class="table-responsive" id="reportPrintArea">
                <table id="reportsTable">
                    <thead><tr><th>Date</th><th>Description</th><th>Amount (EGP)</th></tr></thead>
                    <tbody><tr><td colspan="3" style="color:#7f8c8d; text-align:center; padding:20px;">Data will appear here after searching...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Tab 4: Settings -->
    <div id="settingsTab" class="tab-content admin-only">
        <div class="card">
            <h2 class="section-title">🛠️ Exchange Rates</h2>
            <div class="grid-form">
                <div class="form-group"><label>USD to EGP:</label><input type="number" id="rateUSD" value="50" onchange="updateRates()"></div>
                <div class="form-group"><label>EUR to EGP:</label><input type="number" id="rateEUR" value="55" onchange="updateRates()"></div>
                <div class="form-group"><label>GBP to EGP:</label><input type="number" id="rateGBP" value="65" onchange="updateRates()"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyH8WrOZiqBqwYVo5NGc_Rg0EMS_m7LoB2bi1n6-NSYg3P7_uVLRzzq4dJAuJ28SPsMww/exec"; 
    let RATES = { USD: 50, EUR: 55, GBP: 65, EGP: 1 };
    let loggedInUser = '';

    // --- ذاكرة القوائم المنسدلة الديناميكية ---
    let clientsDB = JSON.parse(localStorage.getItem('fleetClients')) || ["Albatros", "Malikia", "Akassia"];
    let driversDB = JSON.parse(localStorage.getItem('fleetDrivers')) || ["Adeeb", "Hussein", "Marzouk", "Ismail"];
    let tripsDB   = JSON.parse(localStorage.getItem('fleetTrips'))   || ["Airport Transfer", "City Tour"];

    function renderDatalists() {
        document.getElementById('clientList').innerHTML = clientsDB.map(i => `<option value="${i}">`).join('');
        document.getElementById('driverList').innerHTML = driversDB.map(i => `<option value="${i}">`).join('');
        document.getElementById('tripList').innerHTML = tripsDB.map(i => `<option value="${i}">`).join('');
        toggleReportTarget(); // Update reports dropdown as well
    }

    const today = new Date().toISOString().slice(0, 10);
    document.getElementById('tripDate').value = today;
    document.getElementById('finDate').value = today;
    document.getElementById('repFrom').value = today;
    document.getElementById('repTo').value = today;

    window.addEventListener('load', () => {
        renderDatalists(); // تشغيل القوائم
        fetch(GOOGLE_SCRIPT_URL + "?action=getUsers", { redirect: 'follow' })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    const userSelect = document.getElementById('loginUser');
                    data.users.forEach(u => {
                        const opt = document.createElement('option');
                        opt.value = u.username;
                        opt.textContent = u.username.toUpperCase();
                        userSelect.appendChild(opt);
                    });
                    document.getElementById('loginBtn').innerText = "Login 🚀";
                    document.getElementById('loginBtn').disabled = false;
                }
            }).catch(err => { toast('❌ Connection failed.', 'error'); });

        setTimeout(() => {
            document.getElementById('splashScreen').style.opacity = '0';
            setTimeout(() => { document.getElementById('splashScreen').style.display = 'none'; document.getElementById('loginOverlay').style.visibility = 'visible'; document.getElementById('loginOverlay').style.opacity = '1'; }, 600);
        }, 2200);
    });

    function toast(msg, type='info') {
        const stack = document.getElementById('toastStack');
        const el = document.createElement('div'); el.className = 'toast';
        el.style.backgroundColor = type === 'error' ? '#e74c3c' : (type === 'success' ? '#27ae60' : '#1e3c72');
        el.innerHTML = msg; stack.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3500);
    }

    function togglePasswordVisibility() { const pass = document.getElementById('loginPass'); pass.type = pass.type === 'password' ? 'text' : 'password'; }

    function login() {
        const u = document.getElementById('loginUser').value, p = document.getElementById('loginPass').value.trim();
        if(!u || !p) return;
        const btn = document.getElementById('loginBtn'); btn.innerText = "Verifying..."; btn.disabled = true;

        fetch(GOOGLE_SCRIPT_URL + "?action=login&username=" + encodeURIComponent(u) + "&password=" + encodeURIComponent(p), { redirect: 'follow' })
            .then(res => res.json()).then(data => {
                if (data.status === 'success') {
                    loggedInUser = u; document.getElementById('loginOverlay').style.display = 'none'; document.getElementById('mainApp').style.display = 'block';
                    document.getElementById('userInfo').textContent = `👤 Welcome, ${u.toUpperCase()}`;
                    document.querySelectorAll('.admin-only').forEach(el => { el.style.display = data.role === 'Admin' ? '' : 'none'; });
                } else { toast('❌ Incorrect password!', 'error'); btn.innerText = "Login 🚀"; btn.disabled = false; }
            }).catch(err => { toast('❌ Auth error.', 'error'); btn.innerText = "Login 🚀"; btn.disabled = false; });
    }

    function logout() { location.reload(); }
    function showTab(tabId, btn) { document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById(tabId).classList.add('active'); btn.classList.add('active'); }

    function calcTotals() {
        const totalRev = (parseFloat(document.getElementById('revEGP').value) || 0) + ((parseFloat(document.getElementById('revUSD').value) || 0) * RATES.USD) + ((parseFloat(document.getElementById('revEUR').value) || 0) * RATES.EUR) + ((parseFloat(document.getElementById('revGBP').value) || 0) * RATES.GBP);
        document.getElementById('totalRevEGP').textContent = totalRev.toFixed(2);
    }
    function updateRates() { RATES.USD = parseFloat(document.getElementById('rateUSD').value) || 50; RATES.EUR = parseFloat(document.getElementById('rateEUR').value) || 55; RATES.GBP = parseFloat(document.getElementById('rateGBP').value) || 65; calcTotals(); }

    function toggleReportTarget() {
        const type = document.getElementById('reportType').value;
        const target = document.getElementById('reportTarget');
        target.innerHTML = '';
        const list = (type === 'client') ? clientsDB : driversDB;
        list.forEach(item => { target.innerHTML += `<option value="${item}">${item}</option>`; });
    }

    function fetchReports() {
        const type = document.getElementById('reportType').value;
        const target = document.getElementById('reportTarget').value;
        const fromDate = document.getElementById('repFrom').value;
        const toDate = document.getElementById('repTo').value;
        
        if (!target) return toast('⚠️ Please select a target', 'error');

        const btn = document.getElementById('searchBtn');
        btn.innerText = "⏳ Searching..."; btn.disabled = true;

        const url = `${GOOGLE_SCRIPT_URL}?action=getReports&type=${type}&target=${encodeURIComponent(target)}&from=${fromDate}&to=${toDate}`;

        fetch(url, { redirect: 'follow' })
            .then(res => res.json())
            .then(data => {
                btn.innerText = "Search 🔍"; btn.disabled = false;
                if (data.status === 'success') {
                    const tbody = document.querySelector('#reportsTable tbody');
                    tbody.innerHTML = '';
                    let total = 0;
                    
                    if (data.data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#7f8c8d; padding:20px;">No data found.</td></tr>';
                        return;
                    }

                    data.data.forEach(row => {
                        const amt = parseFloat(row.amount) || 0;
                        total += amt;
                        const d = new Date(row.date).toLocaleDateString('en-GB');
                        tbody.innerHTML += `<tr><td>${d}</td><td>${row.desc}</td><td style="font-weight:bold;">${amt.toFixed(2)}</td></tr>`;
                    });

                    tbody.innerHTML += `<tr class="total-row"><td colspan="2" style="text-align:right; color:#1e3c72;">Total Balance:</td><td style="color:#27ae60;">${total.toFixed(2)}</td></tr>`;
                    toast('✅ Reports loaded!', 'success');
                } else {
                    toast('❌ Error: ' + data.message, 'error');
                }
            })
            .catch(err => {
                btn.innerText = "Search 🔍"; btn.disabled = false;
                toast('❌ Network error', 'error');
            });
    }

    function saveTrip() {
        const client = document.getElementById('tripClient').value.trim();
        const driver = document.getElementById('tripDriver').value.trim();
        const tripName = document.getElementById('tripName').value.trim();
        
        if (!client || !driver || !tripName) return toast('⚠️ Complete all core fields!', 'error');

        const payload = { record_type: "trip", client_name: client, driver_name: driver, trip_name: tripName, date: document.getElementById('tripDate').value, notes: document.getElementById('tripNotes').value, revenue: parseFloat(document.getElementById('totalRevEGP').textContent) || 0, driver_fee: parseFloat(document.getElementById('tripDriverFee').value) || 0, tip_egp: document.getElementById('tipEGP').value || 0, tip_usd: document.getElementById('tipUSD').value || 0, tip_eur: document.getElementById('tipEUR').value || 0, tip_gbp: document.getElementById('tipGBP').value || 0, total_tip: parseFloat(document.getElementById('tipEGP').value || 0) + ((document.getElementById('tipUSD').value || 0)*RATES.USD) };
        const btn = event.target; btn.innerText = "⏳ Saving..."; btn.disabled = true;

        fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then(() => { 
            toast('✅ Recorded!', 'success'); 
            btn.innerText = "Save & Submit Trip 💾"; btn.disabled = false; 

            // حفظ الأسماء الجديدة في الذاكرة
            if(!clientsDB.includes(client)) { clientsDB.push(client); localStorage.setItem('fleetClients', JSON.stringify(clientsDB)); }
            if(!driversDB.includes(driver)) { driversDB.push(driver); localStorage.setItem('fleetDrivers', JSON.stringify(driversDB)); }
            if(!tripsDB.includes(tripName)) { tripsDB.push(tripName); localStorage.setItem('fleetTrips', JSON.stringify(tripsDB)); }
            renderDatalists(); // تحديث القوائم فوراً

            // تفريغ الحقول بعد الحفظ
            document.getElementById('tripClient').value = '';
            document.getElementById('tripDriver').value = '';
            document.getElementById('tripName').value = '';
            document.getElementById('revEGP').value = '0';
            document.getElementById('revUSD').value = '0';
            document.getElementById('revEUR').value = '0';
            document.getElementById('revGBP').value = '0';
            document.getElementById('tipEGP').value = '0';
            document.getElementById('tipUSD').value = '0';
            document.getElementById('tipEUR').value = '0';
            document.getElementById('tipGBP').value = '0';
            document.getElementById('tripDriverFee').value = '';
            calcTotals();
        })
        .catch(err => { toast('❌ Error.', 'error'); btn.innerText = "Save & Submit Trip 💾"; btn.disabled = false; });
    }

    function saveFinance() {
        const payload = { record_type: "finance", fin_type: document.getElementById('finType').value, category: document.getElementById('finCategory').value, amount: parseFloat(document.getElementById('finAmount').value), date: document.getElementById('finDate').value, notes: document.getElementById('finNotes').value, added_by: loggedInUser };
        const btn = event.target; btn.innerText = "⏳ Saving..."; btn.disabled = true;
        
        fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then(() => { toast('✅ Saved!', 'success'); btn.innerText = "Submit Transaction 💾"; btn.disabled = false; })
        .catch(err => { toast('❌ Error.', 'error'); btn.disabled = false; });
    }

    function exportToExcel() {
        let table = document.getElementById("reportsTable");
        let wb = XLSX.utils.table_to_book(table, {sheet: "Report"});
        XLSX.writeFile(wb, "SamyFleet_Report.xlsx");
        toast('✅ Excel downloaded!', 'success');
    }
</script>
</body>
</html>
