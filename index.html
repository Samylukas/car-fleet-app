<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safaga Management App</title>
    <style>
        /* إعدادات عامة للخطوط والمسافات */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        /* شريط التنقل (تاتس للتبديل بين الشاشات) - لن يظهر في الطباعة */
        .navbar {
            text-align: center;
            margin-bottom: 20px;
        }
        .navbar button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #1a365d;
            color: white;
            border: none;
            border-radius: 5px;
            margin: 0 5px;
        }
        .navbar button:hover {
            background-color: #2a528a;
        }

        /* =========================================
           1. شاشة الـ Master Data (التوسيط والديناميكية)
           ========================================= */
        .master-data-container {
            display: flex;
            flex-wrap: wrap; /* للنزول للسطر التالي في الشاشات الصغيرة */
            justify-content: center; /* توسيط الكروت */
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            flex: 1;
            min-width: 320px;
            max-width: 500px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
        }

        .card h3 {
            color: #1a365d;
            border-bottom: 2px solid #28a745; /* الخط الأخضر */
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .input-group button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            background-color: #1a365d;
            color: white;
            padding: 10px;
            text-align: left;
        }

        .data-table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            text-align: center;
        }

        /* =========================================
           2. شاشة التقارير (تصغير الحجم و 70 سجل)
           ========================================= */
        .report-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: none; /* مخفية في البداية */
        }

        /* تكبير اسم الشريك */
        .report-title {
            font-size: 24px; 
            font-weight: bold;
            text-align: center;
            color: #1a365d;
            margin-bottom: 15px;
        }

        .report-table {
            width: 100%;
            border-collapse: collapse;
            /* الخط السفلي في نهاية التقرير */
            border-bottom: 3px solid #1a365d; 
        }

        /* تصغير المسافات عشان يشيل 70 سجل */
        .report-table th, .report-table td {
            padding: 4px 8px; /* مسافات داخلية صغيرة */
            font-size: 13px; /* حجم خط مناسب للطباعة الكثيفة */
            line-height: 1.2;
            border: 1px solid #ddd;
            text-align: center;
        }

        .report-table th {
            background-color: #fdf5e6; /* لون مقارب للصورة */
            color: #1a365d;
            font-weight: bold;
        }

        .no-data {
            padding: 15px !important;
            font-size: 14px !important;
            color: #666;
        }

        /* =========================================
           3. إعدادات الطباعة (Portrait)
           ========================================= */
        @media print {
            @page {
                size: portrait; /* إجبار الطباعة بشكل طولي */
                margin: 1cm;
            }
            body {
                background-color: white;
            }
            /* إخفاء الزراير والقوائم وقت الطباعة */
            .no-print {
                display: none !important;
            }
            .report-container {
                box-shadow: none;
                margin: 0;
                padding: 0;
            }
        }
    </style>
</head>
<body>

    <!-- أزرار التنقل -->
    <div class="navbar no-print">
        <button onclick="showTab('master')">⚙️ Master Data</button>
        <button onclick="showTab('report')">📄 Reports</button>
    </div>

    <!-- شاشة إدخال البيانات -->
    <div id="master-view">
        <h2 style="color: #1a365d; margin-bottom: 20px; text-align: center;">⚙️ Master Data Management</h2>
        
        <div class="master-data-container">
            <!-- كارت العملاء -->
            <div class="card">
                <h3>👥 Clients</h3>
                <div class="input-group">
                    <input type="text" placeholder="Client Name...">
                    <button>Add</button>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Client Name</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Europa Clinic</td>
                            <td>✏️ 🗑️</td>
                        </tr>
                        <tr>
                            <td>Samy Airport</td>
                            <td>✏️ 🗑️</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- كارت الشركاء -->
            <div class="card">
                <h3>🤝 Partners</h3>
                <div class="input-group">
                    <input type="text" placeholder="Partner Name...">
                    <button>Add</button>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Partner Name</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td>Adel</td><td>✏️ 🗑️</td></tr>
                        <tr><td>Husain</td><td>✏️ 🗑️</td></tr>
                        <tr><td>Esmaiel</td><td>✏️ 🗑️</td></tr>
                        <tr><td>Adeeb</td><td>✏️ 🗑️</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- شاشة التقرير -->
    <div id="report-view" class="report-container">
        <!-- زرار الطباعة -->
        <button class="no-print" onclick="window.print()" style="float: right; padding: 5px 15px; background: #1a365d; color: white; border: none; cursor: pointer; border-radius: 4px;">🖨️ Print</button>
        
        <div class="report-title">
            Partner Report: Adeeb (2026-09-10 to 2026-09-10) 🚘
        </div>
        
        <table class="report-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Destination</th>
                    <th>Car Type</th>
                    <th>Type</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody>
                <!-- صف يظهر عند عدم وجود بيانات -->
                <tr>
                    <td colspan="5" class="no-data">لا توجد بيانات لهذه الفترة</td>
                </tr>
                <!-- لبرمجة 70 سجل لاحقاً، الـ <tr> سيتكرر هنا ولن يأخذ مساحة كبيرة بفضل الـ CSS -->
            </tbody>
        </table>
    </div>

    <!-- كود جافاسكريبت بسيط للتبديل بين الشاشات -->
    <script>
        function showTab(tabName) {
            if (tabName === 'master') {
                document.getElementById('master-view').style.display = 'block';
                document.getElementById('report-view').style.display = 'none';
            } else {
                document.getElementById('master-view').style.display = 'none';
                document.getElementById('report-view').style.display = 'block';
            }
        }
    </script>
</body>
</html>
